<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Verify</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <!-- The single visible element on the page. -->
  <div id="display"
       class="display"
       role="textbox"
       aria-label="Answer display. Tap for short pulse, hold for long pulse."
       aria-live="polite"
       aria-atomic="true"
       tabindex="0"></div>

  <!-- Screen reader live region for status announcements (visually hidden). -->
  <div id="sr-status" class="sr-only" role="status" aria-live="polite"></div>

  <script src="/static/script.js" defer></script>
</body>
</html>
